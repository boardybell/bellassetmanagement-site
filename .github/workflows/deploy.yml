name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Read site mode
        run: echo "SITE_MODE=$(tr -d '[:space:]' < SITE_MODE)" >> "$GITHUB_ENV"
      - run: npm run build
      # Compliance archive: every production publish leaves a dated static snapshot in the repo.
      - name: Snapshot published pages to archive/
        if: env.SITE_MODE == 'production'
        run: |
          day=$(date -u +%F)
          rm -rf "archive/$day" && mkdir -p "archive/$day"
          cp -R dist/. "archive/$day/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "archive/$day"
          git diff --cached --quiet || { git commit -m "archive: snapshot of published site $day [skip ci]" && git push; }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
